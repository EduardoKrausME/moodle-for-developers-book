<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient>
  </defs>
  <rect width="1440" height="1080" fill="#fff"/>
  <text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Segurança</text>
  
<path d="M720 330 L865 390 L845 650 Q720 790 595 650 L575 390 Z" fill="#ff8500" stroke="#07305f" stroke-width="14"/>
<text x="720" y="485" font-family="Arial,Helvetica,sans-serif" font-size="90" font-weight="700" fill="#fff" text-anchor="middle">🔒</text><text x="720" y="585" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">Segurança</text><text x="720" y="630" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">no Moodle</text>
<g><rect x="30" y="135" width="390" height="150" rx="18" fill="#fff4f2" stroke="#ef4a3a" stroke-width="3"/><text x="54" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#d82a1d" text-anchor="start">XSS</text><text x="54" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Entrada ou saída não tratada pode</text><text x="54" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">executar script no navegador.</text></g>
<g><rect x="1020" y="135" width="390" height="150" rx="18" fill="#fff4f2" stroke="#ef4a3a" stroke-width="3"/><text x="1044" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#d82a1d" text-anchor="start">SQL Injection</text><text x="1044" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">SQL montado manualmente pode</text><text x="1044" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">permitir manipulação indevida.</text></g>
<g><rect x="30" y="795" width="390" height="150" rx="18" fill="#fff4f2" stroke="#ef4a3a" stroke-width="3"/><text x="54" y="837" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#d82a1d" text-anchor="start">CSRF</text><text x="54" y="873" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Ações de mudança de estado precisam</text><text x="54" y="900" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">de proteção de sessão.</text></g>
<g><rect x="1020" y="795" width="390" height="150" rx="18" fill="#fff4f2" stroke="#ef4a3a" stroke-width="3"/><text x="1044" y="837" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#d82a1d" text-anchor="start">Acesso indevido</text><text x="1044" y="873" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Capability, contexto e ownership</text><text x="1044" y="900" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">precisam ser verificados.</text></g>
<g><rect x="470" y="135" width="500" height="145" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="494" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Validação de parâmetros</text><text x="494" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Use required_param(), optional_param() e tipos</text><text x="494" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">PARAM_* adequados.</text></g>
<g><rect x="180" y="380" width="340" height="150" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="204" y="422" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Sesskey e CSRF</text><text x="204" y="458" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Confirme sesskey em ações que</text><text x="204" y="485" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">alteram estado.</text></g>
<g><rect x="180" y="575" width="340" height="150" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="204" y="617" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Escapar saída</text><text x="204" y="653" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Use helpers de output e escape</text><text x="204" y="680" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">conforme o contexto.</text></g>
<g><rect x="920" y="380" width="340" height="150" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="944" y="422" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Capabilities</text><text x="944" y="458" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Verifique permissões no</text><text x="944" y="485" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">contexto correto.</text></g>
<g><rect x="920" y="575" width="340" height="150" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="944" y="617" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Queries seguras</text><text x="944" y="653" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Prefira DML e placeholders; não</text><text x="944" y="680" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">concatene SQL.</text></g>
<g><rect x="500" y="835" width="440" height="145" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="524" y="877" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Sanitização</text><text x="524" y="913" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Normalize somente quando a regra exigir;</text><text x="524" y="940" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">não confunda sanitizar com escapar.</text></g>
<path d="M 420 210 L 560 360" fill="none" stroke="#ef4a3a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1020 210 L 880 360" fill="none" stroke="#ef4a3a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 420 870 L 575 675" fill="none" stroke="#ef4a3a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1020 870 L 865 675" fill="none" stroke="#ef4a3a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  </svg>