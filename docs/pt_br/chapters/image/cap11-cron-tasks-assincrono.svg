<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient>
  </defs>
  <rect width="1440" height="1080" fill="#fff"/>
  <text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Cron, Tasks e Processamento Assíncrono</text>
  
<g><rect x="25" y="195" width="205" height="430" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="49" y="237" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Cron</text><text x="49" y="273" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Processo CLI</text><text x="49" y="300" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">executado</text><text x="49" y="327" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">frequentemente</text><text x="49" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">para consumir</text><text x="49" y="381" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">tarefas pendentes.</text></g>
<text x="128" y="500" font-family="Arial,Helvetica,sans-serif" font-size="120" font-weight="700" fill="#1976c9" text-anchor="middle">◷</text>
<g><rect x="280" y="135" width="370" height="220" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="304" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Scheduled Tasks</text><text x="304" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Executadas periodicamente conforme</text><text x="304" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">db/tasks.php e a agenda</text><text x="304" y="267" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">configurada.</text></g>
<g><rect x="280" y="405" width="370" height="220" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="304" y="447" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Adhoc Tasks</text><text x="304" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Enfileiradas sob demanda quando</text><text x="304" y="510" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">uma ação precisa continuar fora da</text><text x="304" y="537" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">requisição HTTP.</text></g>
<polyline points="230,330 255,330 255,245 274,245" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="230,500 255,500 255,515 274,515" fill="none" stroke="#1976c9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="700" y="220" width="220" height="405" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="724" y="262" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Fila</text><text x="724" y="298" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Tarefas aguardam o</text><text x="724" y="325" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">cron ou workers</text><text x="724" y="352" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">disponíveis; a</text><text x="724" y="379" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">infraestrutura</text><text x="724" y="406" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">define a latência</text><text x="724" y="433" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">real.</text></g>
<path d="M 650 245 L 692 315" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 650 515 L 692 515" fill="none" stroke="#1976c9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="970" y="220" width="220" height="405" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="994" y="262" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Execução</text><text x="994" y="298" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Workers executam a</text><text x="994" y="325" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">lógica em</text><text x="994" y="352" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">background, com</text><text x="994" y="379" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">locking quando há</text><text x="994" y="406" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">risco de</text><text x="994" y="433" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">concorrência.</text></g>
<path d="M 920 425 L 962 425" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="1240" y="220" width="175" height="405" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1264" y="262" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Logs</text><text x="1264" y="298" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Resultado,</text><text x="1264" y="325" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">duração e</text><text x="1264" y="352" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">falhas ficam</text><text x="1264" y="379" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">disponíveis</text><text x="1264" y="406" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">para</text><text x="1264" y="433" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">diagnóstico.</text></g>
<path d="M 1190 425 L 1232 425" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="760" width="1383" height="230" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="52" y="802" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Componentes envolvidos</text><text x="52" y="838" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Cron dispara; Scheduled e Adhoc Tasks representam o trabalho; locking protege concorrência; logs mostram</text><text x="52" y="865" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">o resultado.</text></g>
<rect x="280" y="885" width="150" height="42" rx="21" fill="#1976c9"/><text x="355" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Cron</text><rect x="460" y="885" width="210" height="42" rx="21" fill="#ff8500"/><text x="565" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Scheduled</text><rect x="700" y="885" width="180" height="42" rx="21" fill="#1976c9"/><text x="790" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Adhoc</text><rect x="910" y="885" width="180" height="42" rx="21" fill="#1976c9"/><text x="1000" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Lock API</text><rect x="1120" y="885" width="170" height="42" rx="21" fill="#35a85a"/><text x="1205" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Logs</text>

  </svg>