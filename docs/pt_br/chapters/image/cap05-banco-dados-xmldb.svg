<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Banco de Dados e XMLDB</text>
<g><rect x="28" y="120" width="415" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">install.xml</text><text x="52" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Define a estrutura inicial do banco</text><text x="52" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">de dados do plugin: tabelas, campos,</text><text x="52" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">chaves e índices.</text></g><g><rect x="512" y="120" width="415" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="536" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">XMLDB Editor</text><text x="536" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Ferramenta visual para criar e</text><text x="536" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">validar install.xml conforme o</text><text x="536" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">esquema XMLDB.</text></g><g><rect x="996" y="120" width="415" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1020" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Criação no Banco</text><text x="1020" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Na instalação, o Moodle lê</text><text x="1020" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">install.xml e cria as estruturas</text><text x="1020" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">necessárias.</text></g>
<path d="M 445 220 L 505 220" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 929 220 L 989 220" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="365" width="1383" height="360" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="407" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Estrutura Criada</text><text x="52" y="443" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">O XMLDB descreve os elementos da estrutura de forma independente do SGBD.</text></g>
<g><rect x="55" y="470" width="290" height="190" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="79" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Tabelas</text><text x="79" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Objetos principais</text><text x="79" y="575" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">persistidos pelo plugin.</text></g><g><rect x="370" y="470" width="290" height="190" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="394" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Campos</text><text x="394" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Nome, tipo, tamanho e</text><text x="394" y="575" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">obrigatoriedade.</text></g><g><rect x="685" y="470" width="290" height="190" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="709" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Chaves</text><text x="709" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Chaves primárias e</text><text x="709" y="575" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">estrangeiras para</text><text x="709" y="602" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">integridade.</text></g><g><rect x="1000" y="470" width="290" height="190" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1024" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Índices</text><text x="1024" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Melhoram o desempenho de</text><text x="1024" y="575" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">consultas.</text></g>
<g><rect x="28" y="770" width="410" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="812" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">upgrade.php</text><text x="52" y="848" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Contém as mudanças incrementais</text><text x="52" y="875" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">necessárias quando uma nova versão do</text><text x="52" y="902" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">plugin altera o esquema.</text></g><g><rect x="515" y="770" width="410" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="539" y="812" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Alterações de Esquema</text><text x="539" y="848" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Usa a API XMLDB para adicionar,</text><text x="539" y="875" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">modificar ou remover tabelas, campos,</text><text x="539" y="902" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">chaves e índices.</text></g><g><rect x="1000" y="770" width="411" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1024" y="812" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Banco Atualizado</text><text x="1024" y="848" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Aplica mudanças preservando os dados</text><text x="1024" y="875" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">existentes e a integridade do</text><text x="1024" y="902" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">sistema.</text></g><path d="M 440 870 L 508 870" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 927 870 L 993 870" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>