<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Tipos de Plugins Moodle</text>
<rect x="500" y="390" width="440" height="300" rx="28" fill="url(#core)" stroke="#ff8500" stroke-width="4"/><text x="720" y="500" font-family="Arial,Helvetica,sans-serif" font-size="132" font-weight="900" fill="#f47b20" text-anchor="middle">m</text><text x="720" y="575" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#07305f" text-anchor="middle">Núcleo do Moodle</text><text x="720" y="620" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#49657b" text-anchor="middle">Fornece contratos e pontos de extensão para</text><text x="720" y="649" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#49657b" text-anchor="middle">cada família de plugin.</text>
<g><rect x="35" y="125" width="405" height="160" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="59" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Activity modules</text><text x="59" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Atividades e recursos adicionados ao</text><text x="59" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">curso: fóruns, quizzes, jogos e</text><text x="59" y="257" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">ferramentas.</text></g><g><rect x="515" y="125" width="410" height="160" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="539" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Blocks</text><text x="539" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Blocos de interface com informações e</text><text x="539" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">funcionalidades adicionais.</text></g><g><rect x="1000" y="125" width="405" height="160" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="1024" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Local</text><text x="1024" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Funcionalidades específicas do site e</text><text x="1024" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">integrações institucionais.</text></g>
<g><rect x="35" y="330" width="355" height="145" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="59" y="372" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Themes</text><text x="59" y="408" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Alteram aparência e layout do</text><text x="59" y="435" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Moodle.</text></g><g><rect x="35" y="510" width="355" height="145" rx="18" fill="#f2fbf5" stroke="#41a862" stroke-width="3"/><text x="59" y="552" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#217b40" text-anchor="start">Auth</text><text x="59" y="588" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Métodos de autenticação: LDAP,</text><text x="59" y="615" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">SAML, OAuth e outros.</text></g><g><rect x="35" y="690" width="355" height="145" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="59" y="732" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Enrolment</text><text x="59" y="768" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Métodos de matrícula e</text><text x="59" y="795" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">sincronização de usuários nos</text><text x="59" y="822" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">cursos.</text></g>
<g><rect x="1050" y="330" width="355" height="145" rx="18" fill="#f6f4ff" stroke="#6d59d9" stroke-width="3"/><text x="1074" y="372" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#4c38ad" text-anchor="start">Question types</text><text x="1074" y="408" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Novos tipos de questões para o</text><text x="1074" y="435" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Question Engine.</text></g><g><rect x="1050" y="510" width="355" height="145" rx="18" fill="#fff4f2" stroke="#ef4a3a" stroke-width="3"/><text x="1074" y="552" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#d82a1d" text-anchor="start">Reports</text><text x="1074" y="588" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Relatórios e análises de dados</text><text x="1074" y="615" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">do ambiente.</text></g><g><rect x="1050" y="690" width="355" height="145" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="1074" y="732" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Filters</text><text x="1074" y="768" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Transformam conteúdo durante a</text><text x="1074" y="795" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">renderização.</text></g>
<g><rect x="250" y="875" width="420" height="135" rx="18" fill="#f6f4ff" stroke="#6d59d9" stroke-width="3"/><text x="274" y="917" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#4c38ad" text-anchor="start">Repositories</text><text x="274" y="953" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Integram repositórios externos de</text><text x="274" y="980" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">arquivos.</text></g><g><rect x="770" y="875" width="420" height="135" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="794" y="917" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Web services</text><text x="794" y="953" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Expõem funções para sistemas externos</text><text x="794" y="980" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">por APIs.</text></g>
<polyline points="440,205 470,205 470,420 500,420" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 720 285 L 720 382" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1000,205 970,205 970,420 942,420" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 390 402 L 494 460" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 390 582 L 494 540" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 390 762 L 494 620" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 460 L 1044 402" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 540 L 1044 582" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 620 L 1044 762" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="600,875 600,770 620,700" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="840,875 840,770 820,700" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
