<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient>
  </defs>
  <rect width="1440" height="1080" fill="#fff"/>
  <text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Events, Callbacks e Hooks</text>
  
<g><rect x="28" y="135" width="390" height="370" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Ação no sistema</text><text x="52" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Um usuário realiza uma ação</text><text x="52" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">relevante, como acessar um curso,</text><text x="52" y="267" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">enviar uma tarefa ou criar um</text><text x="52" y="294" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">usuário.</text></g>
<rect x="80" y="365" width="290" height="42" rx="21" fill="#ff8500"/><text x="225" y="394" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">course_viewed</text><rect x="80" y="420" width="290" height="42" rx="21" fill="#1976c9"/><text x="225" y="449" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">user_created</text>
<g><rect x="500" y="135" width="390" height="370" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="524" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Evento</text><text x="524" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">O Moodle cria e dispara um Event que</text><text x="524" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">descreve algo que já aconteceu.</text></g>
<rect x="550" y="365" width="290" height="42" rx="21" fill="#1976c9"/><text x="695" y="394" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">event-&gt;trigger()</text>
<path d="M 420 320 L 492 320" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="980" y="120" width="430" height="145" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1004" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Observers</text><text x="1004" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Plugins reagem ao Event sem modificar a</text><text x="1004" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">ação original.</text></g>
<g><rect x="980" y="285" width="430" height="145" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="1004" y="327" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Logs</text><text x="1004" y="363" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Eventos sustentam auditoria e</text><text x="1004" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">acompanhamento.</text></g>
<g><rect x="980" y="450" width="430" height="145" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="1004" y="492" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Callbacks</text><text x="1004" y="528" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Contratos históricos ainda usados por</text><text x="1004" y="555" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">APIs específicas.</text></g>
<g><rect x="980" y="615" width="430" height="145" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1004" y="657" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Hooks</text><text x="1004" y="693" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Pontos de extensão modernos para</text><text x="1004" y="720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">customizar fluxos previstos.</text></g>
<polyline points="890,320 935,320 935,192 974,192" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="890,320 935,320 935,357 974,357" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="890,320 935,320 935,522 974,522" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="890,320 935,320 935,687 974,687" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="810" width="1383" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="852" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Plugins reagindo</text><text x="52" y="888" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Um plugin pode atualizar estatísticas, enviar notificações, alimentar relatórios ou executar outra lógica</text><text x="52" y="915" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">desacoplada.</text></g>
<rect x="170" y="920" width="220" height="42" rx="21" fill="#1976c9"/><text x="280" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Curso</text><rect x="455" y="920" width="220" height="42" rx="21" fill="#ff8500"/><text x="565" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Notificação</text><rect x="740" y="920" width="220" height="42" rx="21" fill="#1976c9"/><text x="850" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Relatório</text><rect x="1025" y="920" width="220" height="42" rx="21" fill="#1976c9"/><text x="1135" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Outros plugins</text>
<path d="M 695 510 L 695 800" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  </svg>