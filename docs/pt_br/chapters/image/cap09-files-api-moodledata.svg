<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient>
  </defs>
  <rect width="1440" height="1080" fill="#fff"/>
  <text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Files API e moodledata</text>
  
<g><rect x="18" y="125" width="265" height="300" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><circle cx="56" cy="163" r="24" fill="#ff8500"/><text x="56" y="172" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="94" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Upload / Editor</text><text x="42" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Usuário envia um arquivo</text><text x="42" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">ou insere conteúdo no</text><text x="42" y="257" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">editor.</text></g>
<g><rect x="300" y="125" width="265" height="300" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><circle cx="338" cy="163" r="24" fill="#2587d9"/><text x="338" y="172" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="376" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Área de rascunho</text><text x="324" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Arquivo fica</text><text x="324" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">temporariamente no draft</text><text x="324" y="257" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">do usuário.</text></g>
<g><rect x="582" y="125" width="265" height="300" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><circle cx="620" cy="163" r="24" fill="#ff8500"/><text x="620" y="172" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="658" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">File Storage</text><text x="606" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Files API registra</text><text x="606" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">metadados e associa o</text><text x="606" y="257" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">arquivo ao contexto</text><text x="606" y="284" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">correto.</text></g>
<g><rect x="864" y="125" width="265" height="300" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><circle cx="902" cy="163" r="24" fill="#2587d9"/><text x="902" y="172" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="940" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">pluginfile.php</text><text x="888" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Valida contexto e</text><text x="888" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">permissões antes de</text><text x="888" y="257" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">entregar o arquivo.</text></g>
<g><rect x="1146" y="125" width="265" height="300" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><circle cx="1184" cy="163" r="24" fill="#ff8500"/><text x="1184" y="172" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1222" y="167" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Navegador</text><text x="1170" y="203" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Arquivo é exibido,</text><text x="1170" y="230" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">baixado ou incorporado</text><text x="1170" y="257" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">ao conteúdo.</text></g>
<path d="M 283 275 L 294 275" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 565 275 L 576 275" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 847 275 L 858 275" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1129 275 L 1140 275" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="500" width="1383" height="270" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="542" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">moodledata</text><text x="52" y="578" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Camada física de armazenamento. O conteúdo dos arquivos é organizado por hash; o banco guarda metadados,</text><text x="52" y="605" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">não o binário em si.</text></g>
<text x="120" y="655" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">/moodledata/</text><path d="M 270 645 L 380 645" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="400" y="620" width="120" height="42" rx="21" fill="#ff8500"/><text x="460" y="649" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">filedir</text><path d="M 525 645 L 590 645" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="610" y="620" width="90" height="42" rx="21" fill="#1976c9"/><text x="655" y="649" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">a1</text><path d="M 705 645 L 770 645" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="790" y="620" width="90" height="42" rx="21" fill="#1976c9"/><text x="835" y="649" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">b2</text><path d="M 885 645 L 950 645" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="970" y="620" width="90" height="42" rx="21" fill="#1976c9"/><text x="1015" y="649" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">c3</text><path d="M 1065 645 L 1130 645" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1150" y="620" width="180" height="42" rx="21" fill="#1976c9"/><text x="1240" y="649" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">arquivo por hash</text>
<g><rect x="28" y="825" width="420" height="170" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="867" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Banco de Dados</text><text x="52" y="903" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Tabela files armazena metadados,</text><text x="52" y="930" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">referências de contexto e contenthash.</text></g>
<g><rect x="510" y="825" width="420" height="170" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="534" y="867" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Files API</text><text x="534" y="903" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Gerencia ciclo de vida, recuperação,</text><text x="534" y="930" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">permissões e integração com plugins.</text></g>
<g><rect x="992" y="825" width="420" height="170" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1016" y="867" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Segurança</text><text x="1016" y="903" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">pluginfile.php aplica autorização antes</text><text x="1016" y="930" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">da entrega ao cliente.</text></g>

  </svg>