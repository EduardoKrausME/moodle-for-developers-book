<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient>
  </defs>
  <rect width="1440" height="1080" fill="#fff"/>
  <text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Compatibilidade e Manutenção entre Versões</text>
  
<g><rect x="28" y="120" width="420" height="190" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">APIs estáveis</text><text x="52" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Use APIs públicas e feature detection</text><text x="52" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">quando o comportamento pode variar</text><text x="52" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">entre branches.</text></g>
<g><rect x="510" y="120" width="420" height="190" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="534" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Depreciações</text><text x="534" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Trate avisos de deprecated como dívida</text><text x="534" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">com prazo, não como ruído de log.</text></g>
<g><rect x="992" y="120" width="420" height="190" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1016" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Testes automatizados</text><text x="1016" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Valide o plugin em uma matriz</text><text x="1016" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">representativa de Moodle, PHP e banco.</text></g>
<g><rect x="28" y="365" width="1383" height="360" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="407" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Linha de manutenção</text><text x="52" y="443" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Compatibilidade é uma faixa suportada e testada, não a esperança de que o plugin instale.</text></g>
<g><rect x="90" y="485" width="330" height="165" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="114" y="527" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Branch mínima</text><text x="114" y="563" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Versão mais antiga que recebe</text><text x="114" y="590" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">correções e faz parte da</text><text x="114" y="617" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">matriz.</text></g>
<g><rect x="555" y="465" width="330" height="205" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="579" y="507" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Branch principal</text><text x="579" y="543" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Referência de desenvolvimento e</text><text x="579" y="570" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">testes funcionais completos.</text></g>
<g><rect x="1020" y="485" width="330" height="165" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1044" y="527" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Próxima branch</text><text x="1044" y="563" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Antecipe depreciações e quebras</text><text x="1044" y="590" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">antes do upgrade dos clientes.</text></g>
<path d="M 425 565 L 548 565" fill="none" stroke="#7c8e9b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 890 565 L 1013 565" fill="none" stroke="#1976c9" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="150" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="260" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Compatibilidade</text><rect x="430" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="540" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Migração</text><rect x="710" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="820" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Suporte definido</text><rect x="990" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="1100" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Evolução</text>
<g><rect x="28" y="790" width="420" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="832" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">CI</text><text x="52" y="868" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Executa builds, PHPUnit, Behat e</text><text x="52" y="895" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">validações em combinações escolhidas de</text><text x="52" y="922" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">versões.</text></g>
<g><rect x="510" y="790" width="420" height="200" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="534" y="832" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Matriz</text><text x="534" y="868" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Documenta Moodle, PHP, bancos e</text><text x="534" y="895" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">dependências oficialmente suportadas.</text></g>
<g><rect x="992" y="790" width="420" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1016" y="832" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Upgrade seguro</text><text x="1016" y="868" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Versionamento, upgrade.php, testes e</text><text x="1016" y="895" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">release notes tornam a mudança</text><text x="1016" y="922" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">previsível.</text></g>

  </svg>