<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Arquitetura do Moodle</text>
<g><rect x="28" y="112" width="1384" height="140" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="154" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Usuários</text><text x="52" y="190" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Aluno acessa conteúdos e atividades; professor cria e gerencia cursos; administrador configura e</text><text x="52" y="217" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">mantém o ambiente.</text></g>
<rect x="470" y="185" width="145" height="42" rx="21" fill="#ff8500"/><text x="542.5" y="214" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Aluno</text><rect x="650" y="185" width="165" height="42" rx="21" fill="#1976c9"/><text x="732.5" y="214" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Professor</text><rect x="850" y="185" width="210" height="42" rx="21" fill="#75899a"/><text x="955" y="214" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Administrador</text><path d="M 720 258 L 720 305" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="310" width="1384" height="150" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="352" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Interface</text><text x="52" y="388" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Temas, navegação e páginas organizam a experiência e apresentam conteúdos, atividades e informações ao</text><text x="52" y="415" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">usuário.</text></g>
<rect x="430" y="390" width="150" height="42" rx="21" fill="#1976c9"/><text x="505" y="419" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Temas</text><rect x="615" y="390" width="180" height="42" rx="21" fill="#1976c9"/><text x="705" y="419" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Navegação</text><rect x="830" y="390" width="160" height="42" rx="21" fill="#1976c9"/><text x="910" y="419" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Páginas</text><path d="M 720 466 L 720 520" fill="none" stroke="#1976c9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="500" y="525" width="440" height="250" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="524" y="567" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Núcleo do Moodle</text><text x="524" y="603" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#49657b" text-anchor="start">Gerencia usuários, cursos, permissões,</text><text x="524" y="633" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#49657b" text-anchor="start">atividades e a lógica central da plataforma.</text></g>
<text x="720" y="652" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="900" fill="#f47b20" text-anchor="middle">m</text><text x="720" y="708" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#07305f" text-anchor="middle">Moodle</text>
<g><rect x="30" y="520" width="360" height="105" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="54" y="562" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">APIs</text><text x="54" y="598" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Integração e serviços para outros</text><text x="54" y="621" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">componentes.</text></g><g><rect x="30" y="640" width="360" height="105" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="54" y="682" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Plugins</text><text x="54" y="718" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Estendem funcionalidades sem</text><text x="54" y="741" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">alterar o core.</text></g><g><rect x="30" y="760" width="360" height="105" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="54" y="802" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Eventos</text><text x="54" y="838" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Notificam que algo relevante</text><text x="54" y="861" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">aconteceu.</text></g>
<g><rect x="1050" y="520" width="360" height="105" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1074" y="562" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Tarefas</text><text x="1074" y="598" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Executam processos agendados e</text><text x="1074" y="621" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">assíncronos.</text></g><g><rect x="1050" y="640" width="360" height="105" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="1074" y="682" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Arquivos</text><text x="1074" y="718" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Files API e armazenamento de</text><text x="1074" y="741" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">conteúdo.</text></g><g><rect x="1050" y="760" width="360" height="105" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="1074" y="802" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Banco de Dados</text><text x="1074" y="838" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Persistência por DML e XMLDB.</text></g>
<path d="M 392 572 L 494 572" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 392 692 L 494 692" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 392 812 L 494 742" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 572 L 1044 572" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 692 L 1044 692" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 742 L 1044 812" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 720 780 L 720 840" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="850" width="1384" height="190" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="52" y="892" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Infraestrutura</text><text x="52" y="928" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Servidor web, PHP, banco de dados, Moodledata e integrações externas sustentam o funcionamento do Moodle.</text></g>
<rect x="300" y="944" width="190" height="42" rx="21" fill="#75899a"/><text x="395" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Apache / Nginx</text><rect x="520" y="944" width="110" height="42" rx="21" fill="#1976c9"/><text x="575" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">PHP</text><rect x="660" y="944" width="205" height="42" rx="21" fill="#1976c9"/><text x="762.5" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Banco de Dados</text><rect x="895" y="944" width="180" height="42" rx="21" fill="#ff8500"/><text x="985" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">moodledata</text><rect x="1105" y="944" width="210" height="42" rx="21" fill="#1976c9"/><text x="1210" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Integrações</text>
</svg>