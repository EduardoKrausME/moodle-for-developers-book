<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#fff"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#082b5c">Cron, Tasks and Asynchronous Processing</text><text x="800" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#607089">Moodle for Developers</text><rect x="60" y="170" width="474.6666666666667" height="180" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="88" y="224" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">Cron</text><text x="88" y="270" font-family="Arial,sans-serif" font-size="24" fill="#425466">Triggers processing periodically</text><rect x="562.6666666666667" y="170" width="474.6666666666667" height="180" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="590.6666666666667" y="224" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">Scheduled task</text><text x="590.6666666666667" y="270" font-family="Arial,sans-serif" font-size="24" fill="#425466">Recurring background work</text><rect x="1065.3333333333335" y="170" width="474.6666666666667" height="180" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="1093.3333333333335" y="224" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">Ad hoc task</text><text x="1093.3333333333335" y="270" font-family="Arial,sans-serif" font-size="24" fill="#425466">Work queued on demand</text><rect x="60" y="378" width="474.6666666666667" height="180" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="88" y="432" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">Queue</text><text x="88" y="478" font-family="Arial,sans-serif" font-size="24" fill="#425466">Tasks wait for execution</text><rect x="562.6666666666667" y="378" width="474.6666666666667" height="180" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="590.6666666666667" y="432" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">Workers</text><text x="590.6666666666667" y="478" font-family="Arial,sans-serif" font-size="24" fill="#425466">Process tasks in the background</text><rect x="1065.3333333333335" y="378" width="474.6666666666667" height="180" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="1093.3333333333335" y="432" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">Logs</text><text x="1093.3333333333335" y="478" font-family="Arial,sans-serif" font-size="24" fill="#425466">Record status, duration and errors</text></svg>