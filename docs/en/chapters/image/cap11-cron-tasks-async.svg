<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="800" fill="#07305f" text-anchor="middle">Cron, Tasks and Asynchronous Processing</text>
<g><rect x="25" y="195" width="205" height="430" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="49" y="237" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Cron</text><text x="49" y="273" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">CLI process</text><text x="49" y="300" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">executed</text><text x="49" y="327" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">frequently to</text><text x="49" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">consume pending</text><text x="49" y="381" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">tasks.</text></g><text x="128" y="500" font-family="Arial,Helvetica,sans-serif" font-size="120" font-weight="700" fill="#1976c9" text-anchor="middle">◷</text>
<g><rect x="280" y="135" width="370" height="220" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="304" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Scheduled Tasks</text><text x="304" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Run periodically according to</text><text x="304" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">db/tasks.php and the configured</text><text x="304" y="267" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">schedule.</text></g><g><rect x="280" y="405" width="370" height="220" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="304" y="447" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Adhoc Tasks</text><text x="304" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Queued on demand when work must</text><text x="304" y="510" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">continue outside the HTTP request.</text></g>
<polyline points="230,330 255,330 255,245 274,245" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="230,500 255,500 255,515 274,515" fill="none" stroke="#1976c9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="700" y="220" width="220" height="405" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="724" y="262" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Queue</text><text x="724" y="298" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Tasks wait for cron</text><text x="724" y="325" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">or available</text><text x="724" y="352" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">workers;</text><text x="724" y="379" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">infrastructure</text><text x="724" y="406" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">determines real</text><text x="724" y="433" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">latency.</text></g><path d="M 650 245 L 692 315" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 650 515 L 692 515" fill="none" stroke="#1976c9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="970" y="220" width="220" height="405" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="994" y="262" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Execution</text><text x="994" y="298" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Workers run logic in</text><text x="994" y="325" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">the background,</text><text x="994" y="352" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">using locking when</text><text x="994" y="379" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">concurrency is</text><text x="994" y="406" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">risky.</text></g><path d="M 920 425 L 962 425" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="1240" y="220" width="175" height="405" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1264" y="262" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Logs</text><text x="1264" y="298" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Results,</text><text x="1264" y="325" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">duration, and</text><text x="1264" y="352" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">failures are</text><text x="1264" y="379" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">recorded for</text><text x="1264" y="406" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">diagnosis.</text></g><path d="M 1190 425 L 1232 425" fill="none" stroke="#ff8500" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="760" width="1383" height="230" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="52" y="802" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Components involved</text><text x="52" y="838" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Cron triggers processing; Scheduled and Adhoc Tasks represent the work; locking protects concurrency;</text><text x="52" y="865" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">logs show the outcome.</text></g><rect x="280" y="885" width="150" height="42" rx="21" fill="#1976c9"/><text x="355" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Cron</text><rect x="460" y="885" width="210" height="42" rx="21" fill="#ff8500"/><text x="565" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Scheduled</text><rect x="700" y="885" width="180" height="42" rx="21" fill="#1976c9"/><text x="790" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Adhoc</text><rect x="910" y="885" width="180" height="42" rx="21" fill="#75899a"/><text x="1000" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Lock API</text><rect x="1120" y="885" width="170" height="42" rx="21" fill="#35a85a"/><text x="1205" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Logs</text>
</svg>