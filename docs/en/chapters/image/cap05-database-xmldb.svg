<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Database and XMLDB</text>
<g><rect x="28" y="120" width="415" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">install.xml</text><text x="52" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Defines the plugin's initial database</text><text x="52" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">structure: tables, fields, keys, and</text><text x="52" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">indexes.</text></g><g><rect x="512" y="120" width="415" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="536" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">XMLDB Editor</text><text x="536" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Visual tool to create and validate</text><text x="536" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">install.xml according to the XMLDB</text><text x="536" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">schema.</text></g><g><rect x="996" y="120" width="415" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1020" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Database Creation</text><text x="1020" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">During installation, Moodle reads</text><text x="1020" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">install.xml and creates the required</text><text x="1020" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">structures.</text></g>
<path d="M 445 220 L 505 220" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 929 220 L 989 220" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="365" width="1383" height="360" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="407" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Created Structure</text><text x="52" y="443" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">XMLDB describes database elements independently of the DBMS.</text></g>
<g><rect x="55" y="470" width="290" height="190" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="79" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Tables</text><text x="79" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Main objects persisted by</text><text x="79" y="575" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">the plugin.</text></g><g><rect x="370" y="470" width="290" height="190" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="394" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Fields</text><text x="394" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Name, type, size, and</text><text x="394" y="575" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">required state.</text></g><g><rect x="685" y="470" width="290" height="190" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="709" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Keys</text><text x="709" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Primary and foreign keys for</text><text x="709" y="575" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">integrity.</text></g><g><rect x="1000" y="470" width="290" height="190" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1024" y="512" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Indexes</text><text x="1024" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Improve query performance.</text></g>
<g><rect x="28" y="770" width="410" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="812" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">upgrade.php</text><text x="52" y="848" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Contains incremental changes required</text><text x="52" y="875" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">when a new plugin version alters the</text><text x="52" y="902" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">schema.</text></g><g><rect x="515" y="770" width="410" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="539" y="812" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Schema Changes</text><text x="539" y="848" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Uses the XMLDB API to add, modify, or</text><text x="539" y="875" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">remove tables, fields, keys, and</text><text x="539" y="902" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">indexes.</text></g><g><rect x="1000" y="770" width="411" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1024" y="812" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Updated Database</text><text x="1024" y="848" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Applies changes while preserving</text><text x="1024" y="875" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">existing data and system integrity.</text></g><path d="M 440 870 L 508 870" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 927 870 L 993 870" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>