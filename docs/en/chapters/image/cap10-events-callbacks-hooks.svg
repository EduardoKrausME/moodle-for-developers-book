<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Events, Callbacks and Hooks</text>
<g><rect x="28" y="135" width="390" height="370" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">System action</text><text x="52" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">A user performs a relevant action,</text><text x="52" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">such as viewing a course, submitting</text><text x="52" y="267" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">an assignment, or creating a user.</text></g><rect x="80" y="365" width="290" height="42" rx="21" fill="#ff8500"/><text x="225" y="394" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">course_viewed</text><rect x="80" y="420" width="290" height="42" rx="21" fill="#75899a"/><text x="225" y="449" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">user_created</text>
<g><rect x="500" y="135" width="390" height="370" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="524" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Event</text><text x="524" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Moodle creates and triggers an Event</text><text x="524" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">describing something that has</text><text x="524" y="267" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">already happened.</text></g><rect x="550" y="365" width="290" height="42" rx="21" fill="#1976c9"/><text x="695" y="394" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">event-&gt;trigger()</text><path d="M 420 320 L 492 320" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="980" y="120" width="430" height="145" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1004" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Observers</text><text x="1004" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Plugins react to the Event without</text><text x="1004" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">changing the original action.</text></g><g><rect x="980" y="285" width="430" height="145" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="1004" y="327" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Logs</text><text x="1004" y="363" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Events support auditing and activity</text><text x="1004" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">tracking.</text></g><g><rect x="980" y="450" width="430" height="145" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="1004" y="492" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Callbacks</text><text x="1004" y="528" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Historical contracts still used by</text><text x="1004" y="555" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">specific APIs.</text></g><g><rect x="980" y="615" width="430" height="145" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1004" y="657" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Hooks</text><text x="1004" y="693" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Modern extension points for supported</text><text x="1004" y="720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">customization flows.</text></g>
<polyline points="890,320 935,320 935,192 974,192" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="890,320 935,320 935,357 974,357" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="890,320 935,320 935,522 974,522" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="890,320 935,320 935,687 974,687" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="810" width="1383" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="852" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Plugins reacting to the event</text><text x="52" y="888" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">A plugin can update statistics, send notifications, feed reports, or run other decoupled logic.</text></g><rect x="170" y="920" width="220" height="42" rx="21" fill="#1976c9"/><text x="280" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Course</text><rect x="455" y="920" width="220" height="42" rx="21" fill="#ff8500"/><text x="565" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Notification</text><rect x="740" y="920" width="220" height="42" rx="21" fill="#1976c9"/><text x="850" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Report</text><rect x="1025" y="920" width="220" height="42" rx="21" fill="#75899a"/><text x="1135" y="949" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Other plugins</text><path d="M 695 510 L 695 800" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>