<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Moodle Architecture</text>
<g><rect x="28" y="112" width="1384" height="140" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="154" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Users</text><text x="52" y="190" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Students access content and activities; teachers create and manage courses; administrators configure</text><text x="52" y="217" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">and maintain the platform.</text></g>
<rect x="470" y="185" width="145" height="42" rx="21" fill="#ff8500"/><text x="542.5" y="214" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Student</text><rect x="650" y="185" width="165" height="42" rx="21" fill="#1976c9"/><text x="732.5" y="214" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Teacher</text><rect x="850" y="185" width="210" height="42" rx="21" fill="#75899a"/><text x="955" y="214" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Administrator</text><path d="M 720 258 L 720 305" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="310" width="1384" height="150" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="352" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Interface</text><text x="52" y="388" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Themes, navigation, and pages organize the experience and present content, activities, and information to</text><text x="52" y="415" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">users.</text></g>
<rect x="430" y="390" width="150" height="42" rx="21" fill="#1976c9"/><text x="505" y="419" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Themes</text><rect x="615" y="390" width="180" height="42" rx="21" fill="#1976c9"/><text x="705" y="419" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Navigation</text><rect x="830" y="390" width="160" height="42" rx="21" fill="#1976c9"/><text x="910" y="419" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Pages</text><path d="M 720 466 L 720 520" fill="none" stroke="#1976c9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="500" y="525" width="440" height="250" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="524" y="567" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Moodle Core</text><text x="524" y="603" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#49657b" text-anchor="start">Manages users, courses, permissions,</text><text x="524" y="633" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#49657b" text-anchor="start">activities, and the platform's central</text><text x="524" y="663" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#49657b" text-anchor="start">logic.</text></g>
<text x="720" y="652" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="900" fill="#f47b20" text-anchor="middle">m</text><text x="720" y="708" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#07305f" text-anchor="middle">Moodle</text>
<g><rect x="30" y="520" width="360" height="105" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="54" y="562" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">APIs</text><text x="54" y="598" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Integration and services for other</text><text x="54" y="621" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">components.</text></g><g><rect x="30" y="640" width="360" height="105" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="54" y="682" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Plugins</text><text x="54" y="718" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Extend functionality without</text><text x="54" y="741" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">changing core.</text></g><g><rect x="30" y="760" width="360" height="105" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="54" y="802" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Events</text><text x="54" y="838" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Notify that something relevant</text><text x="54" y="861" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">happened.</text></g>
<g><rect x="1050" y="520" width="360" height="105" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1074" y="562" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Tasks</text><text x="1074" y="598" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Run scheduled and asynchronous</text><text x="1074" y="621" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">processes.</text></g><g><rect x="1050" y="640" width="360" height="105" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="1074" y="682" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Files</text><text x="1074" y="718" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Files API and content storage.</text></g><g><rect x="1050" y="760" width="360" height="105" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="1074" y="802" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Database</text><text x="1074" y="838" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#49657b" text-anchor="start">Persistence through DML and XMLDB.</text></g>
<path d="M 392 572 L 494 572" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 392 692 L 494 692" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 392 812 L 494 742" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 572 L 1044 572" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 692 L 1044 692" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 946 742 L 1044 812" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 720 780 L 720 840" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="850" width="1384" height="190" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="52" y="892" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Infrastructure</text><text x="52" y="928" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Web server, PHP, database, moodledata, and external integrations support Moodle's operation.</text></g>
<rect x="300" y="944" width="190" height="42" rx="21" fill="#75899a"/><text x="395" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Apache / Nginx</text><rect x="520" y="944" width="110" height="42" rx="21" fill="#1976c9"/><text x="575" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">PHP</text><rect x="660" y="944" width="205" height="42" rx="21" fill="#1976c9"/><text x="762.5" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Database</text><rect x="895" y="944" width="180" height="42" rx="21" fill="#ff8500"/><text x="985" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">moodledata</text><rect x="1105" y="944" width="210" height="42" rx="21" fill="#1976c9"/><text x="1210" y="973" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Integrations</text>
</svg>