<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#fff"/><text x="800" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#082b5c">Files API and moodledata</text><text x="800" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#607089">Moodle for Developers</text><rect x="60" y="170" width="474.6666666666667" height="180" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="88" y="224" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">1 · Upload</text><text x="88" y="270" font-family="Arial,sans-serif" font-size="24" fill="#425466">File arrives through a form or</text><text x="88" y="301" font-family="Arial,sans-serif" font-size="24" fill="#425466">editor</text><rect x="562.6666666666667" y="170" width="474.6666666666667" height="180" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="590.6666666666667" y="224" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">2 · Draft area</text><text x="590.6666666666667" y="270" font-family="Arial,sans-serif" font-size="24" fill="#425466">Temporary user file area</text><rect x="1065.3333333333335" y="170" width="474.6666666666667" height="180" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="1093.3333333333335" y="224" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">3 · File Storage</text><text x="1093.3333333333335" y="270" font-family="Arial,sans-serif" font-size="24" fill="#425466">Metadata in the database, content</text><text x="1093.3333333333335" y="301" font-family="Arial,sans-serif" font-size="24" fill="#425466">by hash</text><rect x="60" y="378" width="474.6666666666667" height="180" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="88" y="432" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">4 · pluginfile.php</text><text x="88" y="478" font-family="Arial,sans-serif" font-size="24" fill="#425466">Checks context and permissions</text><rect x="562.6666666666667" y="378" width="474.6666666666667" height="180" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="590.6666666666667" y="432" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">5 · Browser</text><text x="590.6666666666667" y="478" font-family="Arial,sans-serif" font-size="24" fill="#425466">Securely delivers the requested</text><text x="590.6666666666667" y="509" font-family="Arial,sans-serif" font-size="24" fill="#425466">file</text><rect x="1065.3333333333335" y="378" width="474.6666666666667" height="180" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="1093.3333333333335" y="432" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f2e5d">moodledata</text><text x="1093.3333333333335" y="478" font-family="Arial,sans-serif" font-size="24" fill="#425466">Physical content stored outside</text><text x="1093.3333333333335" y="509" font-family="Arial,sans-serif" font-size="24" fill="#425466">the web root</text></svg>