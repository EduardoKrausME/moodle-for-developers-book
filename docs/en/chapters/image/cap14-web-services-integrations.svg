<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" fill="#07305f" text-anchor="middle">Web Services and Integrations</text>
<g><rect x="28" y="135" width="360" height="600" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">External Systems</text><text x="52" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Applications that consume Moodle</text><text x="52" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">services.</text></g><rect x="80" y="285" width="250" height="42" rx="21" fill="#ff8500"/><text x="205" y="314" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Mobile app</text><rect x="80" y="360" width="250" height="42" rx="21" fill="#1976c9"/><text x="205" y="389" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">ERP / SIS</text><rect x="80" y="435" width="250" height="42" rx="21" fill="#75899a"/><text x="205" y="464" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Portal</text><rect x="80" y="510" width="250" height="42" rx="21" fill="#1976c9"/><text x="205" y="539" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Automation</text><path d="M 390 430 L 470 430" fill="none" stroke="#ff8500" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="480" y="135" width="930" height="280" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="504" y="177" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Request</text><text x="504" y="213" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">The external system calls a published function and authenticates according to</text><text x="504" y="240" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">the service and protocol.</text></g>
<g><rect x="520" y="255" width="250" height="115" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="544" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#e85e00" text-anchor="start">Token / authentication</text><text x="544" y="333" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49657b" text-anchor="start">Identifies the consumer</text><text x="544" y="355" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49657b" text-anchor="start">and its limits.</text></g><g><rect x="815" y="255" width="250" height="115" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="839" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#0757a6" text-anchor="start">External service</text><text x="839" y="333" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49657b" text-anchor="start">Groups the functions</text><text x="839" y="355" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49657b" text-anchor="start">that can be called.</text></g><g><rect x="1110" y="255" width="250" height="115" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="1134" y="297" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Function</text><text x="1134" y="333" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49657b" text-anchor="start">Declares parameters,</text><text x="1134" y="355" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49657b" text-anchor="start">context, authorization,</text><text x="1134" y="377" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49657b" text-anchor="start">and return value.</text></g><path d="M 770 312 L 807 312" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1065 312 L 1102 312" fill="none" stroke="#46759b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="480" y="455" width="540" height="260" rx="28" fill="url(#core)" stroke="#ff8500" stroke-width="4"/><text x="750" y="555" font-family="Arial,Helvetica,sans-serif" font-size="110" font-weight="900" fill="#f47b20" text-anchor="middle">m</text><text x="750" y="615" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#07305f" text-anchor="middle">Moodle</text><text x="750" y="660" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#49657b" text-anchor="middle">Validates the call, checks permissions, executes the</text><text x="750" y="688" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#49657b" text-anchor="middle">internal API, and prepares the response.</text><path d="M 750 418 L 750 448" fill="none" stroke="#1976c9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="1050" y="455" width="360" height="260" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1074" y="497" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Response</text><text x="1074" y="533" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Data is returned in a format</text><text x="1074" y="560" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">supported by the service, usually</text><text x="1074" y="587" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">JSON or XML.</text></g><rect x="1105" y="610" width="110" height="42" rx="21" fill="#ff8500"/><text x="1160" y="639" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">JSON</text><rect x="1240" y="610" width="110" height="42" rx="21" fill="#75899a"/><text x="1295" y="639" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">XML</text><path d="M 1022 585 L 1042 585" fill="none" stroke="#ff8500" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="28" y="800" width="1383" height="190" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="52" y="842" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Integration Flow</text><text x="52" y="878" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">1 Request → 2 Authentication → 3 Execution → 4 Response → 5 Consumption.</text></g><rect x="175" y="915" width="190" height="42" rx="21" fill="#ff8500"/><text x="270" y="944" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1 Request</text><rect x="395" y="915" width="210" height="42" rx="21" fill="#1976c9"/><text x="500" y="944" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2 Authentication</text><rect x="635" y="915" width="180" height="42" rx="21" fill="#ff8500"/><text x="725" y="944" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3 Execution</text><rect x="845" y="915" width="180" height="42" rx="21" fill="#1976c9"/><text x="935" y="944" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4 Response</text><rect x="1055" y="915" width="180" height="42" rx="21" fill="#ff8500"/><text x="1145" y="944" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5 Consumption</text>
</svg>