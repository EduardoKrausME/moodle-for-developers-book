<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="context-stroke"/></marker><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#ffe4bd"/></linearGradient></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="78" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" fill="#07305f" text-anchor="middle">Compatibility and Maintenance Between Versions</text>
<g><rect x="28" y="120" width="420" height="190" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Stable APIs</text><text x="52" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Use public APIs and feature detection</text><text x="52" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">when behavior may vary across branches.</text></g><g><rect x="510" y="120" width="420" height="190" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="534" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Deprecations</text><text x="534" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Treat deprecated warnings as debt with</text><text x="534" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">a deadline, not harmless log noise.</text></g><g><rect x="992" y="120" width="420" height="190" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1016" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Automated tests</text><text x="1016" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Validate the plugin against a</text><text x="1016" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">representative matrix of Moodle, PHP,</text><text x="1016" y="252" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">and databases.</text></g>
<g><rect x="28" y="365" width="1383" height="360" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="52" y="407" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Maintenance line</text><text x="52" y="443" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Compatibility is a supported and tested range, not the hope that the plugin installs.</text></g>
<g><rect x="90" y="485" width="330" height="165" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="114" y="527" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Minimum branch</text><text x="114" y="563" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Oldest version that still</text><text x="114" y="590" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">receives fixes and remains in</text><text x="114" y="617" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">the test matrix.</text></g><g><rect x="555" y="465" width="330" height="205" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="579" y="507" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Main branch</text><text x="579" y="543" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Primary development target with</text><text x="579" y="570" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">complete functional testing.</text></g><g><rect x="1020" y="485" width="330" height="165" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1044" y="527" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Next branch</text><text x="1044" y="563" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Anticipate deprecations and</text><text x="1044" y="590" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">breaking changes before</text><text x="1044" y="617" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">customer upgrades.</text></g><path d="M 425 565 L 548 565" fill="none" stroke="#7c8e9b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 890 565 L 1013 565" fill="none" stroke="#1976c9" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="150" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="260" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Compatibility</text><rect x="430" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="540" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Migration</text><rect x="710" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="820" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Defined support</text><rect x="990" y="680" width="220" height="42" rx="21" fill="#35a85a"/><text x="1100" y="709" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Evolution</text>
<g><rect x="28" y="790" width="420" height="200" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><text x="52" y="832" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">CI</text><text x="52" y="868" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Runs builds, PHPUnit, Behat, and</text><text x="52" y="895" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">validation across selected version</text><text x="52" y="922" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">combinations.</text></g><g><rect x="510" y="790" width="420" height="200" rx="18" fill="#f7f9fb" stroke="#9aabba" stroke-width="3"/><text x="534" y="832" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#173858" text-anchor="start">Matrix</text><text x="534" y="868" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Documents officially supported Moodle,</text><text x="534" y="895" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">PHP, databases, and dependencies.</text></g><g><rect x="992" y="790" width="420" height="200" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><text x="1016" y="832" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Safe upgrade</text><text x="1016" y="868" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">Versioning, upgrade.php, tests, and</text><text x="1016" y="895" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#49657b" text-anchor="start">release notes make change predictable.</text></g>
</svg>