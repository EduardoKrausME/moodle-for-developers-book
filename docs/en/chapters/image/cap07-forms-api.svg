if" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Validation</text><text x="516" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">Defines rules and</text><text x="516" y="225" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">error messages.</text></g><g><rect x="729" y="120" width="220" height="260" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><circle cx="767" cy="158" r="24" fill="#2587d9"/><text x="767" y="167" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="805" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Processing</text><text x="753" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">Handles already</text><text x="753" y="225" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">validated data.</text></g><g><rect x="966" y="120" width="220" height="260" rx="18" fill="#fff7ec" stroke="#ff8500" stroke-width="3"/><circle cx="1004" cy="158" r="24" fill="#ff8500"/><text x="1004" y="167" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1042" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#e85e00" text-anchor="start">Persistence</text><text x="990" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">Saves data and</text><text x="990" y="225" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">files through</text><text x="990" y="252" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">Moodle APIs.</text></g><g><rect x="1203" y="120" width="220" height="260" rx="18" fill="#f2f9ff" stroke="#2587d9" stroke-width="3"/><circle cx="1241" cy="158" r="24" fill="#2587d9"/><text x="1241" y="167" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1279" y="162" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0757a6" text-anchor="start">Feedback</text><text x="1227" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">Shows a message and</text><text x="1227" y="225" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#49657b" text-anchor="start">redirects the user.</text></g>
